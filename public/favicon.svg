<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- GymLog icon: cream tile + serif G + terracotta dumbbell + sage arc -->
  <rect width="64" height="64" rx="15" fill="#F5EFDC"/>
  <!-- sage arc -->
  <path d="M10 47 Q32 40 54 47" fill="none" stroke="#A9B898" stroke-width="3.2" stroke-linecap="round"/>
  <!-- G (serif-ish skeleton) -->
  <text x="32" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="600" fill="#2E3540" text-anchor="middle">G</text>
  <!-- terracotta dumbbell across the G -->
  <g fill="#C05B2D">
    <rect x="20" y="29" width="5" height="10" rx="2.4"/>
    <rect x="39" y="29" width="5" height="10" rx="2.4"/>
    <rect x="24" y="32.6" width="16" height="2.8" rx="1.4"/>
  </g>
</svg>
